services:
  - type: web
    name: printx-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn printx.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: printx-db
          property: connectionString
      - key: RENDER_BACKEND_URL
        value: "https://printx-backend.onrender.com"

databases:
  - name: printx-db
    databaseName: printx
    user: printx
